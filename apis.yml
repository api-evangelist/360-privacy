aid: 360-privacy
name: 360 Privacy
description: 360 Privacy is a Nashville, Tennessee based digital executive protection company, founded
  in 2019, that reduces the online exposure of executives, public figures, athletes and their families.
  Its analyst-led platform pairs proprietary technology with human intelligence to locate and delete personally
  identifiable information from data broker and people-search sites (360 Delete), to scan the deep and
  dark web for compromised credentials and exposed PII (360 Monitor), and to provide continuous monitoring
  with hands-on threat response for high-risk individuals (360 Defend). The product is delivered as a
  managed service through an authenticated customer dashboard; as of this profile the company publishes
  no public developer program, API reference or machine-readable contract.
